name: Build SimpleLive Android APK
on:
  workflow_dispatch: # ✅ 支持手动点击触发（推荐）
  push:
    branches: [ dev, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full source
        uses: actions/checkout@v4

      - name: Setup Flutter 3.38.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: true

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Get dependencies
        working-directory: ./simple_live_app
        run: flutter pub get

      - name: 编译Release APK
        working-directory: ./simple_live_app
        run: flutter build apk --release

      - name: 查找apk位置
        working-directory: ./simple_live_app
        run: find . -name "*.apk"

      - name: 发布到GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: simple-live-android-release
          files: simple_live_app/build/app/outputs/apk/release/app-release-unsigned.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          retention-days: 30
